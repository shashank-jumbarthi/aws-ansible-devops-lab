---
- name: Deploy Grafana
  hosts: monitor
  become: true

  tasks:
    - name: Create Grafana provisioning directory
      ansible.builtin.file:
        path: /opt/grafana/provisioning/datasources
        state: directory
        mode: "0755"

    - name: Copy Prometheus datasource configuration
      ansible.builtin.copy:
        src: files/grafana/provisioning/datasources/prometheus.yml
        dest: /opt/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
      register: grafana_datasource

    - name: Create monitoring Docker network
      community.docker.docker_network:
        name: monitoring

    - name: Run Grafana container
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: monitoring
        ports:
          - "3000:3000"
        volumes:
          - "grafana-data:/var/lib/grafana"
          - "/opt/grafana/provisioning:/etc/grafana/provisioning:ro"
        recreate: "{{ grafana_datasource.changed | bool }}"
