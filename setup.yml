---
- name: Configure all lab servers
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install useful packages
      apt:
        name:
          - curl
          - git
          - vim
          - htop
        state: present

    - name: Make sure Docker is running
      service:
        name: docker
        state: started
        enabled: yes
